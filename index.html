function normalizePaceFields(card) {
  const minEl = card.querySelector(".block-pace-min");
  const secEl = card.querySelector(".block-pace-sec");
  if (!minEl || !secEl) return;
  const sec = parseFloat(secEl.value);
  if (!isNaN(sec) && sec >= 60) {
    const min = parseFloat(minEl.value) || 0;
    const extraMin = Math.floor(sec / 60);
    minEl.value = String(min + extraMin);
    secEl.value = String(sec % 60);
  }
}

function applyTriangle(card, durSel, distSel) {
  const durEl = card.querySelector(durSel);
  const distEl = card.querySelector(distSel);
  normalizePaceFields(card);
  const currentPace = getPaceDecimalFromCard(card);
  const result = computeTriangle(durEl.value, distEl.value, currentPace);
  if (result.duration !== durEl.value) durEl.value = result.duration;
  if (result.distance !== distEl.value) distEl.value = result.distance;
  if (result.pace !== currentPace && result.pace !== "") setPaceFieldsOnCard(card, result.pace);
}

    const existingSession = wasEditing ? runSessions.find((s) => s.id === runEditingSessionId) : null;

          updateTotal();
          updateSwimSummaryBar();
          scheduleSwimDraftSave();
        });
      });
      strokeEl.addEventListener("input", scheduleSwimDraftSave);
    } else {
      const durEl = card.querySelector(".swim-block-duration");
      const distEl = card.querySelector(".swim-block-distance");
      const recomputePace = () => {
        const d = parseFloat(durEl.value);
        const dist = parseFloat(distEl.value);
        if (!isNaN(d) && !isNaN(dist) && dist > 0) {
          setPaceFieldsOnCard(card, String(round2((d * 100) / dist)));
        } else {
          card.querySelector(".block-pace-min").value = "";
          card.querySelector(".block-pace-sec").value = "";
        }
      };
      [durEl, distEl].forEach((el) => {
        el.addEventListener("input", () => {
          recomputePace();
          updateSwimSummaryBar();
          scheduleSwimDraftSave();
        });
      });
    }

    card.querySelector("[data-duplicate-block]").addEventListener("click", () => {
      const blocks = serializeSwimBlocksFromDOM();
      const index = blocks.findIndex((b) => b.id === card.dataset.id);
      if (index === -1) return;
      const clone = { ...blocks[index], id: uid() };
      blocks.splice(index + 1, 0, clone);
      swimDraft.blocks = blocks;
      saveJSON(KEYS.swimDraft, swimDraft);
      renderSwimContent();
    });

    card.querySelector("[data-remove-block]").addEventListener("click", () => {
      const blocks = serializeSwimBlocksFromDOM();
      if (blocks.length <= 1) {
        const target = blocks.find((b) => b.id === card.dataset.id);
        target.label = "";
        target.duration = "";
        target.distance = "";
        target.pace = "";
        target.poolLength = "";
        target.lengths = "";
        target.stroke = "";
        swimDraft.blocks = blocks;
        saveJSON(KEYS.swimDraft, swimDraft);
        renderSwimContent();
        return;
      }
      swimDraft.blocks = blocks.filter((b) => b.id !== card.dataset.id);
      saveJSON(KEYS.swimDraft, swimDraft);
      renderSwimContent();
    });

    card.querySelectorAll("[data-block-type]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const newMode = btn.dataset.blockType;
        if (card.dataset.mode === newMode) return;
        const blocks = serializeSwimBlocksFromDOM();
        const target = blocks.find((b) => b.id === card.dataset.id);
        target.mode = newMode;
        swimDraft.blocks = blocks;
        saveJSON(KEYS.swimDraft, swimDraft);
        renderSwimContent();
      });
    });

    blocks.push(emptySwimBlock());

    saveJSON(KEYS.swimDraft, swimDraft);
    renderSwimContent();
  });

  document.getElementById("save-swim-session-btn").addEventListener("click", () => {
    const withData = serializeSwimBlocksFromDOM()
      .map((b) => ({ ...b, label: b.label.trim() }))
      .filter((b) => b.label || swimBlockHasData(b));
    const blocks = withData.map((b, idx) => ({ ...b, label: b.label || `Bloc ${idx + 1}` }));

    const errorSlot = document.getElementById("swim-error-slot");
    if (blocks.length === 0) {
      errorSlot.innerHTML = `<div class="error-msg">Ajoute au moins un bloc avec des données avant d'enregistrer.</div>`;
      return;
    }
    errorSlot.innerHTML = "";

    const wasEditing = !!swimEditingSessionId;
    const existingSession = wasEditing ? swimSessions.find((s) => s.id === swimEditingSessionId) : null;
    const planned = existingSession ? isUpcoming(existingSession) : dateEl.value > todayISO();

      swimSessions = swimSessions.map((s) => (s.id === swimEditingSessionId ? session : s));

      swimSessions = [session, ...swimSessions];
    }

    saveJSON(KEYS.swimLibrary, swimLibrary);

// ---------- Scriptable bridge (lecture/écriture réelle du fichier historique) ----------
// Un script Scriptable externe appelle ces deux fonctions via evaluateJavaScript().
// Elles réutilisent restoreFromBackupData() / la même forme que exportBackup(),
// donc pas de logique dupliquée ni de risque de divergence.
window.__scriptableDirty = false;

window.__scriptableExport = function () {
  return JSON.stringify({
    sessions, library, weights,
    runSessions, runLibrary,
    swimSessions, swimLibrary,
    bikeSessions, bikeLibrary,
    exportedAt: new Date().toISOString(),
  });
};

window.__scriptableImport = function (jsonString) {
  try {
    const data = JSON.parse(jsonString);
    restoreFromBackupData(data);
    render();
    return true;
  } catch (e) {
    return false;
  }
};

// ---------- Protection par mot de passe (empreinte SHA-256, jamais en clair) ----------
// Remplace REPLACE_WITH_YOUR_HASH par l'empreinte générée avec generate-hash.html.
// Rappel : c'est un frein côté navigateur, pas une vraie sécurité serveur — le code
// reste visible par quiconque consulte le dépôt, mais le mot de passe lui-même
// n'apparaît jamais en clair, seule son empreinte.
const PASSWORD_HASH = "80c65492faf92d5ee7206b6a591669be511d23d5dd4993f5fca5e1bb72ec5458";

async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function renderPasswordGate() {
  app.className = "";
  app.innerHTML = `
    <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:22px; background:#F7F1E3;">
      <div style="width:64px; height:64px; border-radius:20px; background:#00B899; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 8px 20px rgba(0,184,153,0.25);">${ICONS.dumbbell}</div>
      <div style="text-align:center;">
        <div style="font-family:-apple-system,system-ui,sans-serif; font-weight:800; font-size:24px; letter-spacing:-0.3px; color:#3A3229;">GymLog</div>
        <div style="font-family:-apple-system,system-ui,sans-serif; font-size:13px; color:#8A7F6C; margin-top:2px;">Entre ton mot de passe pour continuer</div>
      </div>
      <form id="password-form" style="display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px;">
        <input type="password" id="password-input" placeholder="Mot de passe" autocomplete="current-password"
          style="padding:14px 16px; border-radius:12px; border:1px solid #E7DCC3; background:#FFFDF8; color:#3A3229; font-size:16px; width:100%; box-sizing:border-box;">
        <button type="submit" style="width:100%; background:#00B899; color:#fff; border:none; border-radius:999px; padding:15px; font-size:15.5px; font-weight:700; font-family:-apple-system,system-ui,sans-serif; cursor:pointer; box-shadow:0 4px 14px rgba(0,184,153,0.3);">Entrer</button>
        <div id="password-error" style="color:#C1443C; font-size:13px; text-align:center; min-height:16px; font-family:-apple-system,system-ui,sans-serif;"></div>
      </form>
    </div>
  `;
  const form = document.getElementById("password-form");
  const input = document.getElementById("password-input");
  const errorEl = document.getElementById("password-error");
  input.focus();
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const hash = await sha256Hex(input.value);
    if (hash === PASSWORD_HASH) {
      setUnlocked();
      render();
    } else {
      errorEl.textContent = "Mot de passe incorrect.";
      input.value = "";
      input.focus();
    }
  });
}

function isUnlocked() {
  try {
    return sessionStorage.getItem("gymlog:unlocked") === "1";
  } catch (e) {
    return false;
  }
}
function setUnlocked() {
  try {
    sessionStorage.setItem("gymlog:unlocked", "1");
  } catch (e) {}
}

if (isUnlocked()) {
  render();
} else {
  renderPasswordGate();
}
