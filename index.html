<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>GymLog</title>
<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --surface-2: #F0F0F3;
    --border: rgba(60, 60, 67, 0.12);
    --text: #1D1D1F;
    --text-dim: #8A8A8E;
    --accent: #007AFF;
    --accent-rgb: 0, 122, 255;
    --rust: #FF3B30;
    --rust-strong: #D6001C;
    --green: #34C759;
    --radius: 18px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  }
  #app.theme-gym { --accent: #00B899; --accent-rgb: 0, 184, 153; }
  #app.theme-run { --accent: #007AFF; --accent-rgb: 0, 122, 255; }
  #app.theme-weight { --accent: #5E5CE6; --accent-rgb: 94, 92, 230; }
  #app.theme-calendar { --accent: #8E8E93; --accent-rgb: 142, 142, 147; }
  #app.theme-settings { --accent: #8E8E93; --accent-rgb: 142, 142, 147; }
  #app.theme-swim { --accent: #32ADE6; --accent-rgb: 50, 173, 230; }
  #app.theme-bike { --accent: #AF52DE; --accent-rgb: 175, 82, 222; }
  #app.theme-home { --accent: #1D1D1F; --accent-rgb: 29, 29, 31; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    overflow: hidden;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }
  #app {
    height: 100%;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  .header { padding: calc(20px + env(safe-area-inset-top)) 20px 16px; background: var(--bg); }
  .header-title {
    font-family: -apple-system, system-ui, sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: -0.4px; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .header-title .bar { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }
  .header-sub { color: var(--text-dim); font-size: 14px; margin-top: 4px; padding-left: 20px; font-weight: 500; }
  .content { flex: 1; padding: 6px 16px 120px; overflow-y: auto; }
  #app.theme-home .content { overflow: hidden; }
  .field-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); font-weight: 600; }
  input[type="text"], input[type="date"], input[type="number"] {
    background: var(--surface-2); border: 1px solid transparent; color: var(--text);
    border-radius: 12px; padding: 11px 13px; font-size: 16px; font-family: inherit; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box;
  }
  input[type="date"] { max-width: 165px; }
  input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.12); }
  .exercise-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; position: relative; box-shadow: var(--shadow-sm); }
  .exercise-card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; background: var(--accent); border-radius: 3px; opacity: 0.85; }
  .exercise-head { display: flex; align-items: center; gap: 4px; padding: 14px 14px 8px 14px; }
  .drag-handle { cursor: grab; touch-action: none; background: none; border: none; color: var(--text-dim); padding: 6px 4px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .drag-handle:hover { color: var(--text); background: var(--surface-2); }
  .drag-handle:active { cursor: grabbing; }
  .exercise-card.dragging { opacity: 0.95; box-shadow: 0 16px 32px rgba(0,0,0,0.14); position: relative; z-index: 50; }
  .exercise-card { touch-action: pan-y; }
  .exercise-head input {
    font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.1px;
    background: transparent; border: none; padding: 4px 2px;
  }
  .icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 7px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .last-perf { margin: 0 14px 8px 17px; font-size: 12.5px; color: var(--text-dim); background: var(--surface-2); border-radius: 10px; padding: 7px 11px; font-weight: 500; }
  .ex-type-toggle { display: flex; gap: 6px; margin: 0 14px 10px 17px; }
  .ex-type-btn { background: var(--surface-2); border: none; color: var(--text-dim); font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 999px; cursor: pointer; }
  .ex-type-btn.active { background: var(--accent); color: #fff; }
  .weight-chip-area:empty { display: none; }
  .weight-chip-label { font-size: 11.5px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.2px; margin: 10px 0 6px; display: flex; align-items: center; gap: 5px; }
  .weight-chip-label svg { width: 12px; height: 12px; }
  .weight-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .weight-chip { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .weight-chip.increment { padding: 7px 11px; min-width: 38px; text-align: center; }
  .weight-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .weight-chip.removable { display: inline-flex; align-items: center; gap: 5px; padding-right: 8px; }
  .weight-chip.removable button { display: flex; background: none; border: none; color: inherit; opacity: 0.6; padding: 0; cursor: pointer; }
  .last-perf b { color: var(--accent); font-weight: 700; }
  .sets-list { padding: 0 0 10px; display: flex; flex-direction: column; gap: 2px; }
  .sets-header { display: flex; align-items: center; gap: 10px; padding: 0 14px 6px 17px; }
  .sets-header .spacer { width: 22px; flex-shrink: 0; }
  .sets-header span:not(.spacer) { flex: 1; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); text-align: center; font-weight: 600; }
  .set-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .sets-list .set-row:last-child { border-bottom: none; padding-bottom: 2px; }
  .set-main { display: flex; align-items: center; gap: 10px; margin: 0 14px 8px 17px; }
  .set-num { width: 22px; flex-shrink: 0; font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 13px; color: var(--text-dim); text-align: center; }
  .set-main input { flex: 1 1 0; width: auto; min-width: 0; padding: 10px; font-size: 16px; text-align: center; font-family: -apple-system, system-ui, sans-serif; font-weight: 600; }
  .set-toolbar { display: flex; justify-content: flex-end; gap: 8px; margin: 0 14px 0 17px; }
  .set-action-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); border: none; color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .set-action-btn:hover { color: var(--text); }
  .set-action-btn:disabled { opacity: 0.3; cursor: default; }
  .set-action-btn.danger { color: var(--rust); }
  .set-action-btn.danger:hover { background: rgba(255,59,48,0.1); }
  .add-set-btn { margin: 4px 14px 14px 17px; background: none; border: 1.5px dashed var(--border); color: var(--text-dim); border-radius: 12px; padding: 9px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; width: calc(100% - 31px); }
  .add-set-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-exercise-btn { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--accent); border-radius: var(--radius); padding: 15px; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .save-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 16px; font-size: 15.5px; font-weight: 700; font-family: -apple-system, system-ui, sans-serif; letter-spacing: -0.1px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.3); }
  .save-btn:active { transform: scale(0.98); }
  .error-msg { color: var(--rust); font-size: 13px; margin-bottom: 10px; padding: 9px 13px; background: rgba(255,59,48,0.08); border-radius: 10px; font-weight: 500; }
  .edit-banner { display: flex; align-items: center; justify-content: space-between; background: rgba(var(--accent-rgb),0.1); color: var(--accent); border: none; border-radius: 12px; padding: 11px 15px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .edit-banner button { background: none; border: none; color: var(--accent); text-decoration: underline; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
  .flash { text-align: center; color: var(--accent); font-size: 13px; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; padding: 6px; cursor: pointer; }
  .tab-btn.active { color: var(--accent); }
  .empty-state { text-align: center; padding: 70px 20px; color: var(--text-dim); }
  .empty-state .bar-icon { margin-bottom: 16px; opacity: 0.35; }
  .history-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .history-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; cursor: pointer; }
  .history-head-left { display: flex; flex-direction: column; gap: 3px; }
  .history-date { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 15px; text-transform: capitalize; letter-spacing: -0.1px; }
  .history-label { font-size: 12.5px; color: var(--accent); font-weight: 600; }
  .history-meta { font-size: 12.5px; color: var(--text-dim); }
  .history-body { padding: 0 17px 15px; display: flex; flex-direction: column; gap: 10px; }
  .history-ex-name { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .history-sets { display: flex; flex-wrap: wrap; gap: 6px; }
  .history-set-chip { background: var(--surface-2); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-family: -apple-system, system-ui, sans-serif; font-weight: 600; color: var(--text); }
  .set-bars-row { display: flex; align-items: flex-end; gap: 12px; padding: 6px 2px 2px; flex-wrap: wrap; }
  .set-bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .set-bar-reps { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 12px; color: var(--accent); min-height: 15px; }
  .set-bar { background: var(--accent); border-radius: 6px; }
  .set-bar-weight { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; color: var(--text-dim); white-space: nowrap; font-weight: 500; }
  .chev { transition: transform 0.15s ease; color: var(--text-dim); }
  .chev.open { transform: rotate(180deg); }
  .delete-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 16px; padding: 0 17px 14px; }
  .edit-link { background: none; border: none; color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .delete-link { background: none; border: none; color: var(--rust); font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .weight-stat-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .weight-stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
  .weight-stat-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .weight-stat-value { font-family: -apple-system, system-ui, sans-serif; font-weight: 800; font-size: 23px; letter-spacing: -0.3px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 12px 10px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .chart-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); padding: 0 6px; margin-bottom: 8px; font-weight: 600; }
  .chart-labels { display: flex; justify-content: space-between; padding: 6px 6px 0; font-size: 11.5px; color: var(--text-dim); font-weight: 500; }
  .weight-entry-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px; margin-bottom: 8px; }
  .weight-entry-date { font-size: 13px; color: var(--text-dim); text-transform: capitalize; font-weight: 500; }
  .weight-entry-value { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 16px; }
  .backup-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .backup-btn { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: 12px; padding: 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .backup-btn.armed-danger { background: rgba(214,0,28,0.12); border-color: var(--rust-strong); color: var(--rust-strong); }
  .backup-btn:hover { color: var(--accent); border-color: var(--accent); }
  .backup-btn.armed-danger:hover { color: var(--rust-strong); border-color: var(--rust-strong); }
  .backup-note { font-size: 12.5px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.55; }
  .sync-status { font-size: 11.5px; color: var(--text-dim); opacity: 0.85; margin-bottom: 10px; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-month-label { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 15px; text-transform: capitalize; letter-spacing: -0.1px; }
  .cal-nav-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .cal-nav-btn:hover { color: var(--text); }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 18px; }
  .cal-cell { aspect-ratio: 1; background: none; border: 1.5px solid transparent; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--text); font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; padding: 0; }
  .cal-cell.empty { cursor: default; }
  .cal-cell:not(.empty):hover { background: var(--surface-2); }
  .cal-cell.has-data { color: var(--accent); font-weight: 700; }
  .cal-cell.selected { background: rgba(var(--accent-rgb), 0.12); border-color: var(--accent); }
  .cal-cell.today .cal-day-num { text-decoration: underline; text-underline-offset: 3px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .cal-selected-label { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 13px; color: var(--accent); text-transform: capitalize; margin: 0 0 10px; }
  .cal-dot-hollow { width: 5px; height: 5px; border-radius: 50%; border: 1.4px solid var(--accent); background: none; }
  .session-group-heading { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); margin: 6px 2px 10px; }
  .upcoming-badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; color: var(--accent); background: rgba(var(--accent-rgb), 0.12); border-radius: 999px; padding: 3px 9px; margin-left: 8px; vertical-align: middle; }
  .source-badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; border-radius: 999px; padding: 3px 9px; margin-left: 8px; vertical-align: middle; }
  .cal-dot-row { display: flex; gap: 3px; }
  .cal-dot-mini { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--text-dim); margin: -2px 0 16px; align-items: center; font-weight: 500; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .time-filter-toggle { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 16px; }
  .time-filter-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text-dim); background: none; border: none; cursor: pointer; }
  .time-filter-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .history-card.upcoming { border: 1.5px dashed rgba(var(--accent-rgb), 0.5); }
  #custom-modal-root:empty { display: none; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px; backdrop-filter: blur(4px); }
  .modal-box { background: var(--surface); border: none; border-radius: 20px; padding: 22px; max-width: 320px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal-message { font-size: 14.5px; color: var(--text); line-height: 1.55; margin-bottom: 18px; font-weight: 500; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-btn { padding: 11px 18px; border-radius: 999px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .modal-cancel { background: var(--surface-2); color: var(--text-dim); }
  .modal-confirm { background: var(--accent); color: #fff; }
  .modal-confirm.danger { background: var(--rust); color: #fff; }
  .back-btn { background: none; border: none; color: var(--text-dim); display: flex; align-items: center; padding: 2px 6px 2px 0; cursor: pointer; }
  .back-btn:hover { color: var(--text); }
  .home-card { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; cursor: pointer; box-shadow: var(--shadow-sm); }
  .home-card:hover { box-shadow: var(--shadow-md); }
  .home-card-icon { width: 46px; height: 46px; border-radius: 14px; background: rgba(var(--accent-rgb),0.12); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .home-card-text { flex: 1; min-width: 0; }
  .home-card-title { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 16.5px; letter-spacing: -0.1px; }
  .home-card-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; font-weight: 500; }
  .home-card-arrow { color: var(--text-dim); flex-shrink: 0; }
  .block-fields-row { display: flex; gap: 10px; margin: 0 14px 12px 17px; }
  input:disabled { opacity: 0.55; background: var(--surface-2); cursor: not-allowed; }
  .block-mode-hint { font-size: 11.5px; color: var(--text-dim); margin: -6px 14px 12px 17px; font-style: normal; }
  .pace-input-group { display: flex; align-items: center; gap: 4px; }
  .pace-input-group input { text-align: center; padding: 10px 4px; }
  .pace-sep { color: var(--text-dim); font-size: 13px; flex-shrink: 0; }
  .block-total-hint { font-size: 12px; color: var(--text-dim); margin: -4px 14px 12px 17px; font-weight: 500; }
  .week-group { margin-bottom: 8px; }
  .week-header { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 4px 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .week-range { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.4px; }

function formatRelativeTime(iso) {
  if (!iso) return "jamais";
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `il y a ${h} h`;
  const d = Math.floor(h / 24);
  if (d < 7) return `il y a ${d} j`;
  const w = Math.floor(d / 7);
  if (w < 5) return `il y a ${w} sem.`;
  const mo = Math.floor(d / 30);
  return `il y a ${mo} mois`;
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
let localStorageWarned = false;
function saveJSON(key, value) {

  } catch (e) {

      console.error("Sauvegarde locale indisponible dans ce contexte (sans incidence : les données restent en mémoire et sont synchronisées via Scriptable).", e);
      localStorageWarned = true;
    }
  }

  // Ne fait rien de risqué et n'a aucun effet quand l'app tourne dans Safari classique.
  window.__scriptableDirty = true;
}

function attachArmedConfirmButton(btn, defaultHTML, confirmHTML, onConfirm) {
  let armed = false;
  let timer = null;
  btn.innerHTML = defaultHTML;
  btn.addEventListener("click", () => {
    if (!armed) {
      armed = true;
      btn.classList.add("armed-danger");
      btn.innerHTML = confirmHTML;
      timer = setTimeout(() => {
        armed = false;
        btn.classList.remove("armed-danger");
        btn.innerHTML = defaultHTML;
      }, 2800);
    } else {
      clearTimeout(timer);
      onConfirm();
    }
  });
}

function showConfirm(message, onConfirm, opts = {}) {
  const root = document.getElementById("custom-modal-root");
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-message">${message}</div>
        <div class="modal-actions">

        </div>
      </div>
    </div>`;
  const close = () => {
    root.innerHTML = "";
  };
  root.querySelector(".modal-cancel").addEventListener("click", () => {
    close();
    if (opts.onCancel) opts.onCancel();
  });
  root.querySelector(".modal-confirm").addEventListener("click", () => {
    close();
    onConfirm();
  });
}

function showAlert(message) {

function isUpcoming(session) {
  // Compat : quelques appels historiques passent une simple date (string) au
  // lieu de l'objet séance complet.
  if (typeof session === "string") return session > todayISO();
  if (!session) return false;
  // Le statut "prévue" ne bascule plus automatiquement en "effectuée" quand
  // la date est dépassée : une fois créée à l'avance, une séance reste dans
  // "à venir" tant qu'on ne l'a pas explicitement marquée comme faite (ou
  // que ce champ n'existe pas encore, auquel cas on retombe sur l'ancienne
  // règle basée sur la date, pour les séances déjà enregistrées avant cette

  if (session.planned !== undefined) return session.planned;
  return session.date > todayISO();
}

    if (total !== null) return total;

      endDate.setDate(endDate.getDate() + 6);
      index[weekStart] = { weekStart, weekEnd: endDate.toISOString().slice(0, 10), sessions: [] };

/* ---------- pace/duration/distance triangle ---------- */
function round2(n) {
  return Math.round(n * 100) / 100;
}
function computeTriangle(durationVal, distanceVal, paceVal) {
  const d = parseFloat(durationVal), dist = parseFloat(distanceVal), p = parseFloat(paceVal);
  const dOk = durationVal !== "" && durationVal != null && !isNaN(d);
  const distOk = distanceVal !== "" && distanceVal != null && !isNaN(dist) && dist > 0;
  const pOk = paceVal !== "" && paceVal != null && !isNaN(p) && p > 0;
  const result = { duration: durationVal, distance: distanceVal, pace: paceVal };
  if (dOk && distOk && !pOk) result.pace = String(round2(d / dist));
  else if (dOk && pOk && !distOk) result.distance = String(round2(d / p));
  else if (distOk && pOk && !dOk) result.duration = String(round2(dist * p));
  return result;
}

/* ---------- swim: data model & calculations ---------- */

  return { id: uid(), label: "", mode: "both", duration: "", distance: "", pace: "", poolLength: "", lengths: "", stroke: "" };

function computeSwimTriangle(durationVal, distanceVal, paceVal) {
  const d = parseFloat(durationVal), dist = parseFloat(distanceVal), p = parseFloat(paceVal);
  const dOk = durationVal !== "" && !isNaN(d);
  const distOk = distanceVal !== "" && !isNaN(dist) && dist > 0;
  const pOk = paceVal !== "" && !isNaN(p) && p > 0;
  const result = { duration: durationVal, distance: distanceVal, pace: paceVal };
  if (dOk && distOk && !pOk) result.pace = String(round2((d * 100) / dist));
  else if (dOk && pOk && !distOk) result.distance = String(round2((d * 100) / p));
  else if (distOk && pOk && !dOk) result.duration = String(round2((p * dist) / 100));
  return result;
}
function formatSwimPaceDisplay(paceStr) {
  const val = parseFloat(paceStr);
  if (!paceStr || isNaN(val) || val <= 0) return null;
  const { min, sec } = splitPaceForDisplay(paceStr);
  return `${min}'${String(sec).padStart(2, "0")}"/100m`;
}
function swimBlockDistanceM(b) {
  if (b.mode === "pool") {
    const poolLength = parseFloat(b.poolLength) || 0;
    const lengths = parseFloat(b.lengths) || 0;
    return poolLength && lengths ? poolLength * lengths : 0;
  }
  if (b.distance) return parseFloat(b.distance);
  if (b.duration && b.pace) return (parseFloat(b.duration) * 100) / parseFloat(b.pace);
  return 0;
}
function swimBlockDurationMin(b) {
  if (b.mode === "pool") {
    if (b.duration) return parseFloat(b.duration);
    const dist = swimBlockDistanceM(b);
    if (dist && b.pace) return (parseFloat(b.pace) * dist) / 100;
    return 0;
  }
  if (b.duration) return parseFloat(b.duration);
  if (b.distance && b.pace) return (parseFloat(b.pace) * parseFloat(b.distance)) / 100;
  return 0;
}
function swimBlockHasData(b) {
  if (b.mode === "pool") return !!(b.poolLength || b.lengths || b.stroke || b.duration);
  return !!(b.duration || b.distance || b.pace);
}
function formatSwimBlockSummary(b) {
  if (b.mode === "pool") {
    const poolLength = b.poolLength || "?";
    const lengths = b.lengths || "?";
    const dist = swimBlockDistanceM(b);
    const strokePart = b.stroke ? ` ${b.stroke}` : "";
    const distPart = dist ? ` (${Math.round(dist)}m)` : "";
    return `${lengths}×${poolLength}m${strokePart}${distPart}`;
  }
  const parts = [];
  if (b.duration) parts.push(`${b.duration}min`);
  if (b.distance) parts.push(`${b.distance}m`);
  if (b.pace) {

    if (p) parts.push(p);
  }
  return parts.length ? parts.join(" · ") : "—";
}
function computeSwimSessionTotals(blocks) {

  blocks.forEach((b) => {

  const pace = m > 0 ? (min * 100) / m : null;
  return { m, min, pace };
}

  const t = computeSwimSessionTotals(blocks);

  const pacePart = t.pace ? formatSwimPaceDisplay(String(t.pace)) || "—" : "—";
  return `${distPart} · ${minPart} · ${pacePart}`;

/* ---------- bike: data model & calculations ---------- */
function emptyBikeBlock() {

function computeBikeTriangle(durationVal, distanceVal, speedVal) {
  const d = parseFloat(durationVal), dist = parseFloat(distanceVal), sp = parseFloat(speedVal);

  else if (distOk && spOk && !dOk) result.duration = String(round2((dist / sp) * 60));
  return result;
}
function bikeBlockHasData(b) {
  return !!(b.duration || b.distance || b.speed);
}
function formatBikeBlockSummary(b) {
  const parts = [];
  if (b.duration) parts.push(`${b.duration}min`);
  if (b.distance) parts.push(`${b.distance}km`);
  if (b.speed) parts.push(`${b.speed}km/h`);
  return parts.length ? parts.join(" · ") : "—";
}
function bikeBlockDistanceKm(b) {
  if (b.distance) return parseFloat(b.distance);
  if (b.duration && b.speed) return (parseFloat(b.speed) * parseFloat(b.duration)) / 60;
  return 0;
}
function bikeBlockDurationMin(b) {
  if (b.duration) return parseFloat(b.duration);
  if (b.distance && b.speed) return (parseFloat(b.distance) / parseFloat(b.speed)) * 60;
  return 0;
}
function computeBikeSessionTotals(blocks) {
  let km = 0, min = 0;
  blocks.forEach((b) => {
    km += bikeBlockDistanceKm(b);
    min += bikeBlockDurationMin(b);
  });
  const speed = min > 0 ? km / (min / 60) : null;
  return { km, min, speed };
}
function formatBikeSessionTotalsLine(blocks) {
  const t = computeBikeSessionTotals(blocks);
  const kmPart = t.km > 0 ? `${Math.round(t.km * 10) / 10} km` : "0 km";
  const minPart = formatDurationMin(t.min);
  const speedPart = t.speed ? `${Math.round(t.speed * 10) / 10} km/h` : "—";
  return `${kmPart} · ${minPart} · ${speedPart}`;
}

async function exportBackup() {
  const backup = {
    sessions, library, weights,
    runSessions, runLibrary,
    swimSessions, swimLibrary,
    bikeSessions, bikeLibrary,
    exportedAt: new Date().toISOString(),
  };
  const json = JSON.stringify(backup, null, 2);
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const filename = `gymlog-historique-${todayISO()}-${hh}h${mm}.json`;

  const file = new File([json], filename, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      saveJSON(KEYS.lastExport, new Date().toISOString());
      return;
    } catch (e) {
      // annulé par l'utilisateur ou échec du partage : on retombe sur le téléchargement classique
    }
  }

  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  saveJSON(KEYS.lastExport, new Date().toISOString());
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

  return Array.isArray(data.sessions) || Array.isArray(data.runSessions) || Array.isArray(data.swimSessions) || Array.isArray(data.bikeSessions);
}

function validateSingleSessionForSection(data, expectedType) {
  if (!data || data.kind !== "gymlog-single-session" || !data.type || !data.session) {
    return { ok: false, message: "Ce fichier ne semble pas être une séance GymLog valide." };
  }
  if (data.type !== expectedType) {
    const gotMeta = ACTIVITY_META.find((a) => a.key === data.type);
    const wantMeta = ACTIVITY_META.find((a) => a.key === expectedType);
    const gotLabel = gotMeta ? gotMeta.label : data.type;
    const wantLabel = wantMeta ? wantMeta.label : expectedType;
    return { ok: false, message: `Ce fichier contient une séance de ${gotLabel}, pas de ${wantLabel}. Importe-le depuis la bonne section.` };
  }
  return { ok: true, session: data.session };
}

function handleImportedFile(data, rerender) {
  if (data.kind === "gymlog-single-session" && data.type && data.session) {
    const meta = ACTIVITY_META.find((a) => a.key === data.type);
    const label = meta ? meta.label : data.type;
    showConfirm(
      `Ajouter cette séance (${formatDateFR(data.session.date)} · ${label}) à ton historique ?`,
      () => {
        mergeImportedSession(data.type, data.session);
        rerender();
        showAlert("Séance ajoutée à ton historique.");

function moveSet(card, setId, direction) {
  const exs = serializeExercisesFromDOM();
  const target = exs.find((e) => e.id === card.dataset.id);
  if (!target) return;
  const idx = target.sets.findIndex((s) => s.id === setId);
  const newIdx = idx + direction;
  if (idx === -1 || newIdx < 0 || newIdx >= target.sets.length) return;
  const [item] = target.sets.splice(idx, 1);
  target.sets.splice(newIdx, 0, item);
  draft.exercises = exs;
  saveJSON(KEYS.draft, draft);
  renderContent();
}

function weightChipAreaHTML(config) {
  if (!config || !config.baseWeights || config.baseWeights.length === 0) return "";
  const bases = [...config.baseWeights].sort((a, b) => a - b);
  const maxInc = config.maxIncrement || 0;
  const baseChips = bases.map((w) => `<button type="button" class="weight-chip" data-base-chip="${w}">${w}kg</button>`).join("");
  let incRow = "";
  if (maxInc > 0) {
    const incs = [];
    for (let i = 0; i <= maxInc; i++) incs.push(i);
    incRow = `<div class="weight-chip-row increments">${incs
      .map((i) => `<button type="button" class="weight-chip increment" data-inc-chip="${i}">${i === 0 ? "+0" : "+" + i}</button>`)
      .join("")}</div>`;
  }
  return `<div class="weight-chip-label">${ICONS.gear} Poids rapide (${config.name})</div><div class="weight-chip-row">${baseChips}</div>${incRow}`;
}

function getPaceDecimalFromCard(card) {
  const minEl = card.querySelector(".block-pace-min");
  const secEl = card.querySelector(".block-pace-sec");
  if (!minEl || !secEl) return "";
  const min = minEl.value === "" ? null : parseFloat(minEl.value);
  const sec = secEl.value === "" ? null : parseFloat(secEl.value);
  if (min === null && sec === null) return "";
  const totalMin = (min || 0) + (sec || 0) / 60;
  return totalMin > 0 ? String(totalMin) : "";
}
function setPaceFieldsOnCard(card, decimalStr) {
  const minEl = card.querySelector(".block-pace-min");

  if (!minEl || !secEl || decimalStr === "" || decimalStr == null) return;

  secEl.value = sec;
}

function gymSettingsListHTML() {
  const uncategorized = gymExerciseConfigs.some((c) => !GYM_EXERCISE_CATEGORIES.some((cat) => cat.key === c.category));
  const tabs = [...GYM_EXERCISE_CATEGORIES, ...(uncategorized ? [{ key: "other", label: "Autres" }] : [])];
  const tabsHTML = `
    <div class="ex-type-toggle" style="margin-bottom:16px;">
      ${tabs
        .map(
          (t) =>
            `<button type="button" class="ex-type-btn ${gymSettingsActiveCategory === t.key ? "active" : ""}" data-settings-category="${t.key}">${t.label}</button>`
        )
        .join("")}
    </div>`;

  const filtered = gymExerciseConfigs.filter((c) => {
    const cat = GYM_EXERCISE_CATEGORIES.some((k) => k.key === c.category) ? c.category : "other";
    return cat === gymSettingsActiveCategory;
  });

  const emptyState = `<div class="empty-state">Aucun exercice dans cette catégorie pour l'instant.<br>Ajoute tes machines habituelles pour gagner du temps à la salle.</div>`;
  const items = [...filtered]
    .sort((a, b) => a.name.localeCompare(b.name))
    .map((c) => {
      const bases = [...c.baseWeights].sort((a, b) => a - b).join(", ");
      const incLabel = c.maxIncrement > 0 ? ` · +0 à +${c.maxIncrement}kg` : "";
      return `
      <div class="history-card">
        <div class="history-head" data-edit-config="${c.id}" style="cursor:pointer;">
          <div class="history-head-left">
            <div class="history-date">${c.name}</div>
            <div class="history-label">${bases ? bases + " kg" : "Aucun palier"}${incLabel}</div>
          </div>
          <button type="button" class="icon-btn" data-delete-config="${c.id}" aria-label="Supprimer">${ICONS.trash}</button>
        </div>
      </div>`;
    })
    .join("");
  return `${tabsHTML}${filtered.length === 0 ? emptyState : items}<button class="add-exercise-btn" id="add-config-btn">${ICONS.plus} Ajouter un exercice</button>`;
}

function attachGymSettingsListeners() {
  document.querySelectorAll("[data-settings-category]").forEach((btn) => {
    btn.addEventListener("click", () => {
      gymSettingsActiveCategory = btn.dataset.settingsCategory;
      renderGymSettingsContent();
    });
  });
  const addBtn = document.getElementById("add-config-btn");
  if (addBtn) {
    addBtn.addEventListener("click", () => {
      gymSettingsFormOpen = true;
      gymSettingsEditingConfigId = null;
      const defaultCategory = gymSettingsActiveCategory === "other" ? "push" : gymSettingsActiveCategory;
      gymSettingsFormDraft = { name: "", category: defaultCategory, baseWeights: [], maxIncrement: 0 };
      renderGymSettingsContent();
    });
  }
  document.querySelectorAll("[data-edit-config]").forEach((el) => {
    el.addEventListener("click", () => {
      const config = gymExerciseConfigs.find((c) => c.id === el.dataset.editConfig);
      if (!config) return;
      gymSettingsFormOpen = true;
      gymSettingsEditingConfigId = config.id;
      gymSettingsFormDraft = {
        name: config.name,
        category: GYM_EXERCISE_CATEGORIES.some((c) => c.key === config.category) ? config.category : "push",
        baseWeights: [...config.baseWeights],
        maxIncrement: config.maxIncrement || 0,
      };
      renderGymSettingsContent();
    });
  });
  document.querySelectorAll("[data-delete-config]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      showConfirm(
        "Supprimer cet exercice configuré ? Les séances déjà enregistrées ne sont pas affectées.",
        () => {
          gymExerciseConfigs = gymExerciseConfigs.filter((c) => c.id !== btn.dataset.deleteConfig);
          saveJSON(KEYS.gymExerciseConfigs, gymExerciseConfigs);
          renderGymSettingsContent();
        },
        { confirmLabel: "Supprimer", danger: true }
      );
    });
  });

  if (!gymSettingsFormOpen) return;

  const nameInput = document.getElementById("config-name-input");
  const incInput = document.getElementById("config-max-increment");
  const newWeightInput = document.getElementById("config-new-base-weight");

  function syncFormFromInputs() {
    gymSettingsFormDraft.name = nameInput.value;
    gymSettingsFormDraft.maxIncrement = parseFloat(incInput.value) || 0;
  }

  document.querySelectorAll("[data-form-category]").forEach((btn) => {
    btn.addEventListener("click", () => {
      syncFormFromInputs();
      gymSettingsFormDraft.category = btn.dataset.formCategory;
      renderGymSettingsContent();
    });
  });
  document.querySelectorAll("[data-suggest-name]").forEach((btn) => {
    btn.addEventListener("click", () => {
      nameInput.value = btn.dataset.suggestName;
      nameInput.focus();
    });
  });
  document.getElementById("config-add-base-weight-btn").addEventListener("click", () => {
    syncFormFromInputs();
    const val = parseFloat(newWeightInput.value);
    if (!isNaN(val) && val >= 0 && !gymSettingsFormDraft.baseWeights.includes(val)) {
      gymSettingsFormDraft.baseWeights.push(val);
    }
    renderGymSettingsContent();
  });
  document.querySelectorAll("[data-remove-base-weight]").forEach((btn) => {
    btn.addEventListener("click", () => {
      syncFormFromInputs();
      const val = parseFloat(btn.dataset.removeBaseWeight);
      gymSettingsFormDraft.baseWeights = gymSettingsFormDraft.baseWeights.filter((w) => w !== val);
      renderGymSettingsContent();
    });
  });
  document.getElementById("cancel-config-btn").addEventListener("click", () => {
    gymSettingsFormOpen = false;
    renderGymSettingsContent();
  });
  document.getElementById("save-config-btn").addEventListener("click", () => {
    syncFormFromInputs();
    const errorSlot = document.getElementById("config-form-error");
    const name = gymSettingsFormDraft.name.trim();
    if (!name) {
      errorSlot.innerHTML = `<div class="error-msg">Donne un nom à cet exercice.</div>`;
      return;
    }
    if (gymSettingsFormDraft.baseWeights.length === 0) {
      errorSlot.innerHTML = `<div class="error-msg">Ajoute au moins un poids possible.</div>`;
      return;
    }
    errorSlot.innerHTML = "";
    const newConfig = {
      id: gymSettingsEditingConfigId || uid(),
      name,
      category: gymSettingsFormDraft.category,
      baseWeights: gymSettingsFormDraft.baseWeights,
      maxIncrement: gymSettingsFormDraft.maxIncrement || 0,
    };
    if (gymSettingsEditingConfigId) {
      gymExerciseConfigs = gymExerciseConfigs.map((c) => (c.id === gymSettingsEditingConfigId ? newConfig : c));
    } else {
      gymExerciseConfigs.push(newConfig);
    }
    saveJSON(KEYS.gymExerciseConfigs, gymExerciseConfigs);
    gymSettingsFormOpen = false;
    renderGymSettingsContent();
  });
  nameInput.focus();
}

function exerciseCardHTML(ex) {
  const exType = ex.exType || "muscu";
  const last = getLastPerformance(ex.name);
  const isCardio = exType === "cardio";
  const setsHTML = ex.sets
    .map((s, i) => {
      const weightInput = `<input class="set-weight" type="number" inputmode="decimal" placeholder="${isCardio ? "min" : "kg"}" value="${s.weight}">`;
      const repsInput = `<input class="set-reps" type="number" inputmode="decimal" placeholder="${isCardio ? "km (optionnel)" : "reps"}" value="${s.reps}">`;
      const cols = isCardio ? weightInput + repsInput : repsInput + weightInput;
      const isFirst = i === 0;
      const isLast = i === ex.sets.length - 1;
      return `
    <div class="set-row" data-id="${s.id}">
      <div class="set-main">
        <div class="set-num">${i + 1}</div>
        ${cols}
      </div>
      <div class="set-toolbar">
        <button type="button" class="set-action-btn" data-move-set-up="${s.id}" aria-label="Monter" ${isFirst ? "disabled" : ""}>${ICONS.miniUp}</button>
        <button type="button" class="set-action-btn" data-move-set-down="${s.id}" aria-label="Descendre" ${isLast ? "disabled" : ""}>${ICONS.miniDown}</button>
        <button type="button" class="set-action-btn danger" data-remove-set="${s.id}" aria-label="Supprimer" ${ex.sets.length === 1 ? "disabled" : ""}>${ICONS.trash}</button>
      </div>
    </div>`;
    })
    .join("");

function weightTabHTML() {
  const sorted = [...weights].sort((a, b) => (a.date < b.date ? 1 : -1));
  const latest = sorted[0];
  const prev = sorted[1];
  const diff = latest && prev ? +(latest.weight - prev.weight).toFixed(1) : null;
  const chartData = [...weights].sort((a, b) => (a.date > b.date ? 1 : -1));

  let statsHTML = "";
  if (latest) {
    statsHTML = `
    <div class="weight-stat-row">
      <div class="weight-stat-card">
        <div class="weight-stat-label">Dernier poids</div>
        <div class="weight-stat-value">${latest.weight} kg</div>
      </div>
      <div class="weight-stat-card">
        <div class="weight-stat-label">Variation</div>
        <div class="weight-stat-value">${diff === null ? "—" : `${diff > 0 ? "+" : ""}${diff} kg`}</div>
      </div>
    </div>`;
  }

  let chartHTML = "";
  if (chartData.length > 1) {
    const vals = chartData.map((d) => d.weight);
    const min = Math.min(...vals) - 1;
    const max = Math.max(...vals) + 1;
    const W = 300, H = 120, pad = 10;
    const points = chartData.map((d, i) => {
      const x = pad + (i / (chartData.length - 1)) * (W - pad * 2);
      const y = H - pad - ((d.weight - min) / (max - min || 1)) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const dots = chartData
      .map((d, i) => {
        const [x, y] = points[i].split(",");
        return `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`;
      })
      .join("");
    chartHTML = `
    <div class="chart-card">
      <div class="chart-title">Évolution</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="140" preserveAspectRatio="none">
        <polyline points="${points.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" />
        ${dots}
      </svg>
      <div class="chart-labels"><span>${formatDateShortFR(chartData[0].date)}</span><span>${formatDateShortFR(chartData[chartData.length - 1].date)}</span></div>
    </div>`;
  }

  const listHTML =
    sorted.length === 0
      ? `<div class="empty-state"><div class="bar-icon">${ICONS.scale}</div>Aucune pesée enregistrée pour l'instant.</div>`
      : sorted
          .map(
            (e) => `
      <div class="weight-entry-row">
        <div class="weight-entry-date">${formatDateFR(e.date)}</div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="weight-entry-value">${e.weight} kg</div>
          <button class="icon-btn" data-delete-weight="${e.id}">${ICONS.trash}</button>
        </div>
      </div>`
          )
          .join("");

  return `
    ${statsHTML}
    ${chartHTML}
    <div class="field-row">
      <div class="field"><label>Date</label><input type="date" id="w-date" value="${todayISO()}"></div>
      <div class="field"><label>Poids (kg)</label><input type="number" inputmode="decimal" id="w-value" placeholder="72.5"></div>
    </div>
    <button class="save-btn" id="save-weight-btn" style="margin-bottom:20px;">${ICONS.check} Enregistrer le poids</button>
    ${listHTML}
  `;
}

function setBarsHTML(ex, colorOverride) {
  const weights = ex.sets.map((s) => parseFloat(s.weight) || 0);
  const reps = ex.sets.map((s) => parseFloat(s.reps) || 0);
  const maxWeight = Math.max(...weights, 1);
  const maxReps = Math.max(...reps, 1);
  const barColorStyle = colorOverride ? `background:${colorOverride};` : "";
  const repsColorStyle = colorOverride ? `color:${colorOverride};` : "";
  const bars = ex.sets
    .map((s, i) => {
      const w = weights[i];
      const r = reps[i];
      const heightPx = w > 0 ? Math.round(20 + (w / maxWeight) * 70) : 8;
      const widthPx = r > 0 ? Math.round(18 + (r / maxReps) * 40) : 14;
      return `
      <div class="set-bar-col">
        <div class="set-bar-reps" style="${repsColorStyle}">${r ? `×${r}` : ""}</div>
        <div class="set-bar" style="height:${heightPx}px;width:${widthPx}px;${barColorStyle}"></div>
        <div class="set-bar-weight">${w ? `${w}kg` : ""}</div>
      </div>`;
    })
    .join("");
  return `<div class="set-bars-row">${bars}</div>`;
}

function shiftCalendarMonth(delta) {
  const [y, m] = calendarMonth.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  calendarMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function calendarViewHTML() {
  const [y, m] = calendarMonth.split("-").map(Number);
  const firstOfMonth = new Date(y, m - 1, 1);
  const startDow = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthLabel = firstOfMonth.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const showFuture = calendarTimeFilter === "future";
  const sessionDates = new Set(sessions.filter((s) => isUpcoming(s) === showFuture).map((s) => s.date));
  const today = todayISO();

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push("<div class=\"cal-cell empty\"></div>");
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calendarMonth}-${String(d).padStart(2, "0")}`;
    const hasData = sessionDates.has(dateStr);
    const isSelected = selectedCalendarDate === dateStr;
    const isToday = dateStr === today;
    cells.push(`
      <button type="button" class="cal-cell ${hasData ? "has-data" : ""} ${isSelected ? "selected" : ""} ${isToday ? "today" : ""}" data-cal-date="${dateStr}">
        <span class="cal-day-num">${d}</span>
        ${hasData ? `<span class="${showFuture ? "cal-dot-hollow" : "cal-dot"}"></span>` : ""}
      </button>`);
  }

  let selectedHTML = "";
  if (selectedCalendarDate) {
    const daySessions = sessions.filter((s) => s.date === selectedCalendarDate && isUpcoming(s) === showFuture);
    selectedHTML =
      daySessions.length > 0
        ? `<div class="cal-selected-label">${formatDateFR(selectedCalendarDate)}</div>${daySessions.map(sessionCardHTML).join("")}`
        : `<div class="empty-state" style="padding: 30px 20px;">Aucune séance ${showFuture ? "prévue" : "effectuée"} ce jour-là.</div>`;
  }

  return `
    ${timeFilterToggleHTML(showFuture, "time-filter")}
    <div class="cal-header">
      <button type="button" class="cal-nav-btn" data-cal-prev>${ICONS.back}</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button type="button" class="cal-nav-btn" data-cal-next>${ICONS.chevronRight}</button>
    </div>
    <div class="cal-weekdays"><div>Lu</div><div>Ma</div><div>Me</div><div>Je</div><div>Ve</div><div>Sa</div><div>Di</div></div>
    <div class="cal-grid">${cells.join("")}</div>
    ${selectedHTML}
  `;
}

function historyTabHTML() {
  const sorted = [...sessions].sort((a, b) => (a.date < b.date ? 1 : -1));
  const lastExport = loadJSON(KEYS.lastExport, null);
  const lastImport = loadJSON(KEYS.lastImport, null);
  const backup = `
    <div class="backup-row">
      <button class="backup-btn" id="export-btn">${ICONS.up} Exporter</button>
      <button class="backup-btn" id="import-btn">${ICONS.down} Importer</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
    </div>
    <div class="sync-status">Dernier export : ${formatRelativeTime(lastExport)} · Dernier import : ${formatRelativeTime(lastImport)}</div>
    <div class="backup-note">Cette sauvegarde inclut toutes tes activités (muscu, course, natation, vélo) — un seul fichier pour tout ton historique. Pour le retrouver sur un autre appareil : exporte ici, envoie-toi le fichier (AirDrop, mail, cloud…), puis importe-le là-bas.</div>
  `;
  const viewToggle = `
    <div class="ex-type-toggle" style="margin: 0 0 16px;">
      <button type="button" class="ex-type-btn ${historyViewMode === "list" ? "active" : ""}" data-history-view="list">${ICONS.history} Liste</button>
      <button type="button" class="ex-type-btn ${historyViewMode === "calendar" ? "active" : ""}" data-history-view="calendar">${ICONS.calendar} Calendrier</button>
    </div>`;

  if (historyViewMode === "calendar") {
    return backup + viewToggle + calendarViewHTML();
  }
  if (sorted.length === 0) {
    return backup + viewToggle + `<div class="empty-state"><div class="bar-icon">${ICONS.history}</div>Aucune séance enregistrée pour l'instant.<br>Va dans l'onglet "Créer" pour ajouter la première.</div>`;
  }
  const upcoming = sorted.filter((s) => isUpcoming(s)).sort((a, b) => (a.date > b.date ? 1 : -1));
  const past = sorted.filter((s) => !isUpcoming(s));
  const showHeadings = upcoming.length > 0 && past.length > 0;
  const upcomingHTML = upcoming.length > 0 ? (showHeadings ? `<div class="session-group-heading">À venir</div>` : "") + upcoming.map(sessionCardHTML).join("") : "";
  const pastHTML = past.length > 0 ? (showHeadings ? `<div class="session-group-heading">Effectuées</div>` : "") + past.map(sessionCardHTML).join("") : "";
  return backup + viewToggle + upcomingHTML + pastHTML;
}

/* ---------- shared calendar (read-only) ---------- */
function shiftSharedCalendarMonth(delta) {
  const [y, m] = sharedCalendarMonth.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  sharedCalendarMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

const ACTIVITY_META = [
  { key: "gym", color: "#5FBFA0", rgb: "95,191,160", label: "Muscu" },
  { key: "run", color: "#6C7BFF", rgb: "108,123,255", label: "Course" },
  { key: "swim", color: "#4FC3D9", rgb: "79,195,217", label: "Natation" },
  { key: "bike", color: "#C48FE0", rgb: "196,143,224", label: "Vélo" },
];
function getActivitySessions(key) {
  if (key === "gym") return sessions;
  if (key === "run") return runSessions;
  if (key === "swim") return swimSessions;
  return bikeSessions;
}

function editActivityFromCalendar(type, id) {
  const session = getActivitySessions(type).find((s) => s.id === id);
  if (!session) return;
  currentApp = type;
  if (type === "gym") startEditSession(session);
  else if (type === "run") startEditRunSession(session);
  else if (type === "swim") startEditSwimSession(session);
  else startEditBikeSession(session);
}

function sharedSessionPreviewHTML(s, type) {
  const meta = ACTIVITY_META.find((a) => a.key === type);
  const color = meta.color;
  const rgb = meta.rgb;
  const label = meta.label;
  let detail, metaCount, statsLine;

  if (type === "gym") {
    detail = s.exercises
      .map(
        (ex) => `
    <div>
      <div class="history-ex-name">${ex.name}</div>
      ${
        (ex.exType || "muscu") === "cardio"
          ? `<div class="history-sets">${ex.sets.map((set) => `<div class="history-set-chip">${formatSetChip(ex.exType, set)}</div>`).join("")}</div>`
          : setBarsHTML(ex, color)
      }
    </div>`
      )
      .join("");
    metaCount = `${s.exercises.length} exo${s.exercises.length !== 1 ? "s" : ""}`;
    statsLine = "";
  } else {
    const formatSummary = type === "run" ? formatBlockSummary : type === "swim" ? formatSwimBlockSummary : formatBikeBlockSummary;
    const formatTotals = type === "run" ? formatSessionTotalsLine : type === "swim" ? formatSwimSessionTotalsLine : formatBikeSessionTotalsLine;
    detail = s.blocks
      .map(
        (b) => `
    <div>
      <div class="history-ex-name">${b.label}</div>
      <div class="history-sets"><div class="history-set-chip">${formatSummary(b)}</div></div>
    </div>`
      )
      .join("");
    metaCount = `${s.blocks.length} bloc${s.blocks.length !== 1 ? "s" : ""}`;
    statsLine = `<div class="history-run-stats" style="color:${color};">${formatTotals(s.blocks)}</div>`;
  }

  return `
  <div class="history-card" style="border-color: rgba(${rgb},0.35);">
    <div class="history-head" style="cursor: default;">
      <div class="history-head-left">
        <div class="history-date">${formatDateFR(s.date)}<span class="source-badge" style="color:${color}; background: rgba(${rgb},0.15);">${label}</span></div>
        ${s.label ? `<div class="history-label" style="color:${color};">${s.label}</div>` : ""}
        ${statsLine}
      </div>
      <div class="history-meta">${metaCount}</div>
    </div>
    <div class="history-body">${detail}</div>
    <div class="delete-row">
      <button class="edit-link" data-shared-edit-type="${type}" data-shared-edit-id="${s.id}">${ICONS.edit} Modifier</button>
      ${isUpcoming(s) ? `<button class="edit-link" data-shared-mark-done-type="${type}" data-shared-mark-done-id="${s.id}">${ICONS.check} Marquer comme faite</button>` : ""}
      <button class="delete-link" data-shared-delete-type="${type}" data-shared-delete-id="${s.id}">${ICONS.trash} Supprimer</button>
    </div>
  </div>`;
}

function sharedCalendarViewHTML() {
  const [y, m] = sharedCalendarMonth.split("-").map(Number);
  const firstOfMonth = new Date(y, m - 1, 1);
  const startDow = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthLabel = firstOfMonth.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const showFuture = sharedCalendarTimeFilter === "future";
  const dateSets = {};
  ACTIVITY_META.forEach((a) => {
    const list = getActivitySessions(a.key).filter((s) => isUpcoming(s) === showFuture);
    dateSets[a.key] = new Set(list.map((s) => s.date));
  });
  const today = todayISO();

  const timeToggle = timeFilterToggleHTML(showFuture, "shared-time-filter");

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push("<div class=\"cal-cell empty\"></div>");
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${sharedCalendarMonth}-${String(d).padStart(2, "0")}`;
    const isSelected = sharedSelectedDate === dateStr;
    const isToday = dateStr === today;
    let hasAny = false;
    const dots = ACTIVITY_META.map((a) => {
      if (!dateSets[a.key].has(dateStr)) return "";
      hasAny = true;
      return `<span class="cal-dot-mini" style="${showFuture ? `background:none;border:1.4px solid ${a.color};` : `background:${a.color};`}"></span>`;
    }).join("");
    cells.push(`
      <button type="button" class="cal-cell ${hasAny ? "has-data" : ""} ${isSelected ? "selected" : ""} ${isToday ? "today" : ""}" data-shared-cal-date="${dateStr}">
        <span class="cal-day-num">${d}</span>
        <span class="cal-dot-row">${dots}</span>
      </button>`);
  }

  let selectedHTML = "";
  if (sharedSelectedDate) {
    const perType = ACTIVITY_META.map((a) => ({
      key: a.key,
      list: getActivitySessions(a.key).filter((s) => s.date === sharedSelectedDate && isUpcoming(s) === showFuture),
    }));
    const anyData = perType.some((t) => t.list.length > 0);
    if (!anyData) {
      selectedHTML = `<div class="empty-state" style="padding: 30px 20px;">Aucune activité ${showFuture ? "prévue" : "effectuée"} ce jour-là.</div>`;
    } else {
      selectedHTML =
        `<div class="cal-selected-label">${formatDateFR(sharedSelectedDate)}</div>` +
        perType.map((t) => t.list.map((s) => sharedSessionPreviewHTML(s, t.key)).join("")).join("");
    }
  }

  return `
    ${timeToggle}
    <div class="cal-header">
      <button type="button" class="cal-nav-btn" data-shared-cal-prev>${ICONS.back}</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button type="button" class="cal-nav-btn" data-shared-cal-next>${ICONS.chevronRight}</button>
    </div>
    <div class="cal-weekdays"><div>Lu</div><div>Ma</div><div>Me</div><div>Je</div><div>Ve</div><div>Sa</div><div>Di</div></div>
    <div class="cal-grid">${cells.join("")}</div>
    <div class="cal-legend">
      ${ACTIVITY_META.map((a) => `<span><span class="cal-dot-mini" style="background:${a.color};"></span> ${a.label}</span>`).join("")}
    </div>
    ${selectedHTML}
  `;
}

function renderSharedCalendarContent() {
  document.getElementById("content").innerHTML = sharedCalendarViewHTML();
  attachSharedCalendarListeners();
}

function markActivityDone(type, id) {
  if (type === "gym") {
    sessions = sessions.map((s) => (s.id === id ? { ...s, planned: false } : s));
    saveJSON(KEYS.sessions, sessions);
  } else if (type === "run") {
    runSessions = runSessions.map((s) => (s.id === id ? { ...s, planned: false } : s));
    saveJSON(KEYS.runSessions, runSessions);
  } else if (type === "swim") {
    swimSessions = swimSessions.map((s) => (s.id === id ? { ...s, planned: false } : s));
    saveJSON(KEYS.swimSessions, swimSessions);
  } else {
    bikeSessions = bikeSessions.map((s) => (s.id === id ? { ...s, planned: false } : s));
    saveJSON(KEYS.bikeSessions, bikeSessions);
  }
}

function attachSharedCalendarListeners() {
  const prev = document.querySelector("[data-shared-cal-prev]");
  const next = document.querySelector("[data-shared-cal-next]");
  if (prev) prev.addEventListener("click", () => { shiftSharedCalendarMonth(-1); renderSharedCalendarContent(); });
  if (next) next.addEventListener("click", () => { shiftSharedCalendarMonth(1); renderSharedCalendarContent(); });
  document.querySelectorAll("[data-shared-time-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      sharedCalendarTimeFilter = btn.dataset.sharedTimeFilter;
      sharedSelectedDate = null;
      renderSharedCalendarContent();
    });
  });
  document.querySelectorAll("[data-shared-cal-date]").forEach((cell) => {
    cell.addEventListener("click", () => {
      const d = cell.dataset.sharedCalDate;
      sharedSelectedDate = sharedSelectedDate === d ? null : d;
      renderSharedCalendarContent();
    });
  });
  document.querySelectorAll("[data-shared-edit-type]").forEach((btn) => {
    btn.addEventListener("click", () => {
      editActivityFromCalendar(btn.dataset.sharedEditType, btn.dataset.sharedEditId);
    });
  });
  document.querySelectorAll("[data-shared-mark-done-type]").forEach((btn) => {
    btn.addEventListener("click", () => {
      markActivityDone(btn.dataset.sharedMarkDoneType, btn.dataset.sharedMarkDoneId);
      renderSharedCalendarContent();
    });
  });
  document.querySelectorAll("[data-shared-delete-type]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const type = btn.dataset.sharedDeleteType;
      const id = btn.dataset.sharedDeleteId;
      showConfirm(
        "Supprimer définitivement cette activité ? Cette action est irréversible.",
        () => {
          if (type === "gym") {
            sessions = sessions.filter((s) => s.id !== id);
            saveJSON(KEYS.sessions, sessions);
          } else if (type === "run") {
            runSessions = runSessions.filter((s) => s.id !== id);
            saveJSON(KEYS.runSessions, runSessions);
          } else if (type === "swim") {
            swimSessions = swimSessions.filter((s) => s.id !== id);
            saveJSON(KEYS.swimSessions, swimSessions);
          } else {
            bikeSessions = bikeSessions.filter((s) => s.id !== id);
            saveJSON(KEYS.bikeSessions, bikeSessions);
          }
          renderSharedCalendarContent();
        },
        { confirmLabel: "Supprimer", danger: true }
      );
    });
  });
}

function splitPaceForDisplay(paceStr) {
  const val = parseFloat(paceStr);
  if (!paceStr || isNaN(val) || val <= 0) return { min: "", sec: "" };
  let min = Math.floor(val);
  let sec = Math.round((val - min) * 60);
  if (sec === 60) { min += 1; sec = 0; }
  return { min: String(min), sec: String(sec) };
}
function formatPaceDisplay(paceStr) {
  const val = parseFloat(paceStr);
  if (!paceStr || isNaN(val) || val <= 0) return null;
  const { min, sec } = splitPaceForDisplay(paceStr);
  return `${min}'${String(sec).padStart(2, "0")}"/km`;
}
function computeSessionTotals(blocks) {
  let km = 0, min = 0;
  blocks.forEach((b) => {
    km += blockDistanceKm(b);
    min += blockDurationMin(b);
  });
  const pace = km > 0 ? min / km : null;
  return { km, min, pace };
}
function formatSessionTotalsLine(blocks) {
  const t = computeSessionTotals(blocks);
  const kmPart = t.km > 0 ? `${Math.round(t.km * 10) / 10} km` : "0 km";
  const minPart = formatDurationMin(t.min);
  const pacePart = t.pace ? formatPaceDisplay(String(t.pace)) : "—";
  return `${kmPart} · ${minPart} · ${pacePart}`;
}

function runCalendarViewHTML() {
  const [y, m] = runCalendarMonth.split("-").map(Number);
  const firstOfMonth = new Date(y, m - 1, 1);
  const startDow = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthLabel = firstOfMonth.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const showFuture = runCalendarTimeFilter === "future";
  const sessionDates = new Set(runSessions.filter((s) => isUpcoming(s) === showFuture).map((s) => s.date));
  const today = todayISO();

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push("<div class=\"cal-cell empty\"></div>");
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${runCalendarMonth}-${String(d).padStart(2, "0")}`;
    const hasData = sessionDates.has(dateStr);
    const isSelected = runSelectedCalendarDate === dateStr;
    const isToday = dateStr === today;
    cells.push(`
      <button type="button" class="cal-cell ${hasData ? "has-data" : ""} ${isSelected ? "selected" : ""} ${isToday ? "today" : ""}" data-run-cal-date="${dateStr}">
        <span class="cal-day-num">${d}</span>
        ${hasData ? `<span class="${showFuture ? "cal-dot-hollow" : "cal-dot"}"></span>` : ""}
      </button>`);
  }

  let selectedHTML = "";
  if (runSelectedCalendarDate) {
    const daySessions = runSessions.filter((s) => s.date === runSelectedCalendarDate && isUpcoming(s) === showFuture);
    selectedHTML =
      daySessions.length > 0
        ? `<div class="cal-selected-label">${formatDateFR(runSelectedCalendarDate)}</div>${daySessions.map(runSessionCardHTML).join("")}`
        : `<div class="empty-state" style="padding: 30px 20px;">Aucune séance ${showFuture ? "prévue" : "effectuée"} ce jour-là.</div>`;
  }

  return `
    ${timeFilterToggleHTML(showFuture, "run-time-filter")}
    <div class="cal-header">
      <button type="button" class="cal-nav-btn" data-run-cal-prev>${ICONS.back}</button>

      <button type="button" class="cal-nav-btn" data-run-cal-next>${ICONS.chevronRight}</button>

  `;
}

function runHistoryTabHTML() {
  const sorted = [...runSessions].sort((a, b) => (a.date < b.date ? 1 : -1));

  if (runHistoryViewMode === "calendar") {
    return backup + viewToggle + runCalendarViewHTML();
  }
  if (sorted.length === 0) {
    return backup + viewToggle + `<div class="empty-state"><div class="bar-icon">${ICONS.history}</div>Aucune séance enregistrée pour l'instant.<br>Va dans l'onglet "Créer" pour ajouter la première.</div>`;
  }

  const upcoming = sorted.filter((s) => isUpcoming(s)).sort((a, b) => (a.date > b.date ? 1 : -1));
  const past = sorted.filter((s) => !isUpcoming(s));
  const upcomingHTML = upcoming.length > 0 ? `<div class="session-group-heading">À venir</div>${upcoming.map(runSessionCardHTML).join("")}` : "";

  const weeks = groupRunSessionsByWeek(past);
  const weeksHTML = weeks
    .map((week) => {
      let totalKm = 0;
      let totalMin = 0;
      week.sessions.forEach((s) => {
        s.blocks.forEach((b) => {
          totalKm += blockDistanceKm(b);
          totalMin += blockDurationMin(b);

function swimCalendarViewHTML() {

  const firstOfMonth = new Date(y, m - 1, 1);

  const daysInMonth = new Date(y, m, 0).getDate();
  const monthLabel = firstOfMonth.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const showFuture = swimCalendarTimeFilter === "future";
  const sessionDates = new Set(swimSessions.filter((s) => isUpcoming(s) === showFuture).map((s) => s.date));
  const today = todayISO();

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push("<div class=\"cal-cell empty\"></div>");
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${swimCalendarMonth}-${String(d).padStart(2, "0")}`;
    const hasData = sessionDates.has(dateStr);
    const isSelected = swimSelectedCalendarDate === dateStr;
    const isToday = dateStr === today;
    cells.push(`
      <button type="button" class="cal-cell ${hasData ? "has-data" : ""} ${isSelected ? "selected" : ""} ${isToday ? "today" : ""}" data-swim-cal-date="${dateStr}">

        ${hasData ? `<span class="${showFuture ? "cal-dot-hollow" : "cal-dot"}"></span>` : ""}
      </button>`);
  }

  let selectedHTML = "";
  if (swimSelectedCalendarDate) {
    const daySessions = swimSessions.filter((s) => s.date === swimSelectedCalendarDate && isUpcoming(s) === showFuture);
    selectedHTML =
      daySessions.length > 0
        ? `<div class="cal-selected-label">${formatDateFR(swimSelectedCalendarDate)}</div>${daySessions.map(swimSessionCardHTML).join("")}`
        : `<div class="empty-state" style="padding: 30px 20px;">Aucune séance ${showFuture ? "prévue" : "effectuée"} ce jour-là.</div>`;
  }

  return `

      <button type="button" class="cal-nav-btn" data-swim-cal-prev>${ICONS.back}</button>

/* ---------- listeners ---------- */
function attachContentListeners() {
  if (tab === "log") attachLogListeners();
  else attachHistoryListeners();
}

function attachLogListeners() {
  const dateEl = document.getElementById("log-date");
  const labelEl = document.getElementById("log-label");
  dateEl.addEventListener("input", scheduleDraftSave);
  labelEl.addEventListener("input", scheduleDraftSave);

  const importDraftBtn = document.getElementById("import-draft-btn");
  const importDraftFile = document.getElementById("import-draft-file");
  importDraftBtn.addEventListener("click", () => importDraftFile.click());

  attachArmedConfirmButton(
    document.getElementById("reset-draft-btn"),
    `${ICONS.reset} Réinitialiser`,
    `${ICONS.reset} Confirmer ?`,
    () => {
      clearDraft();
      renderContent();
    }
  );
  importDraftFile.addEventListener("change", () => {
    const file = importDraftFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try {
        data = JSON.parse(reader.result);
      } catch (e) {
        showAlert("Ce fichier ne semble pas être une séance GymLog valide.");
        importDraftFile.value = "";
        return;
      }
      const result = validateSingleSessionForSection(data, "gym");
      if (!result.ok) {
        showAlert(result.message);
        importDraftFile.value = "";
        return;
      }
      showConfirm(
        `Charger cette séance (${formatDateFR(result.session.date)}) dans le formulaire ? Cela remplacera ce que tu es en train de saisir.`,
        () => {
          const s = result.session;
          draft = {
            date: s.date,
            label: s.label || "",
            exercises: JSON.parse(JSON.stringify(s.exercises)).map((ex) => ({
              ...ex,
              id: uid(),
              sets: ex.sets.map((set) => ({ ...set, id: uid() })),
            })),
            editingSessionId: null,
          };
          editingSessionId = null;
          saveJSON(KEYS.draft, draft);
          renderContent();
        },
        { confirmLabel: "Charger" }
      );
      importDraftFile.value = "";
    };
    reader.readAsText(file);
  });

  const cancelEditBtn = document.getElementById("cancel-edit-btn");
  if (cancelEditBtn) {
    cancelEditBtn.addEventListener("click", () => {
      clearDraft();
      renderContent();
    });
  }

  document.querySelectorAll("#exercises-container .exercise-card").forEach((card) => {
    const nameInput = card.querySelector(".ex-name-input");
    const hint = card.querySelector("[data-hint]");
    const chipArea = card.querySelector("[data-chip-area]");
    nameInput.addEventListener("input", () => {
      const last = getLastPerformance(nameInput.value);
      if (last) {
        hint.style.display = "";
        hint.innerHTML = `Dernière fois (${formatDateFR(last.date)}) : <b>${formatSetsSummary(last.exType, last.sets)}</b>`;
      } else {
        hint.style.display = "none";
        hint.innerHTML = "";
      }
      if (card.dataset.extype !== "cardio") {
        delete card.dataset.selectedBase;
        delete card.dataset.selectedIncrement;
        chipArea.innerHTML = weightChipAreaHTML(findExerciseConfig(nameInput.value));
      }
      scheduleDraftSave();
    });
    card.addEventListener("focusin", (e) => {
      if (e.target.classList.contains("set-weight")) {
        const row = e.target.closest(".set-row");
        if (row) card.dataset.activeSetId = row.dataset.id;
      }
    });
    card.addEventListener("click", (e) => {
      const baseBtn = e.target.closest("[data-base-chip]");
      const incBtn = e.target.closest("[data-inc-chip]");
      if (!baseBtn && !incBtn) return;
      if (baseBtn) {
        card.dataset.selectedBase = baseBtn.dataset.baseChip;
        chipArea.querySelectorAll("[data-base-chip]").forEach((b) => b.classList.toggle("active", b === baseBtn));
      }
      if (incBtn) {
        card.dataset.selectedIncrement = incBtn.dataset.incChip;
        chipArea.querySelectorAll("[data-inc-chip]").forEach((b) => b.classList.toggle("active", b === incBtn));
      }
      const base = parseFloat(card.dataset.selectedBase || "0");
      const inc = parseFloat(card.dataset.selectedIncrement || "0");
      const total = Math.round((base + inc) * 100) / 100;
      let targetInput = null;
      if (card.dataset.activeSetId) {
        targetInput = card.querySelector(`.set-row[data-id="${card.dataset.activeSetId}"] .set-weight`);
      }
      if (!targetInput) {
        const rows = card.querySelectorAll(".set-row");
        if (rows.length) targetInput = rows[rows.length - 1].querySelector(".set-weight");
      }
      if (targetInput) {
        targetInput.value = total;
        scheduleDraftSave();
      }
    });
    card.querySelectorAll(".set-weight, .set-reps").forEach((input) => {
      input.addEventListener("input", scheduleDraftSave);
    });
    card.querySelectorAll("[data-move-set-up]").forEach((btn) => {
      btn.addEventListener("click", () => moveSet(card, btn.dataset.moveSetUp, -1));
    });
    card.querySelectorAll("[data-move-set-down]").forEach((btn) => {
      btn.addEventListener("click", () => moveSet(card, btn.dataset.moveSetDown, 1));
    });
    card.querySelectorAll("[data-set-type]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (card.dataset.extype === btn.dataset.setType) return;
        const exs = serializeExercisesFromDOM();
        const target = exs.find((e) => e.id === card.dataset.id);
        target.exType = btn.dataset.setType;
        draft.exercises = exs;
        saveJSON(KEYS.draft, draft);
        renderContent();
      });
    });
    card.querySelector("[data-remove-ex]").addEventListener("click", () => {
      const exs = serializeExercisesFromDOM();
      if (exs.length <= 1) {
        const target = exs.find((e) => e.id === card.dataset.id);
        target.name = "";
        target.sets = [{ id: uid(), weight: "", reps: "" }];
        draft.exercises = exs;
        saveJSON(KEYS.draft, draft);
        renderContent();
        return;
      }
      draft.exercises = exs.filter((e) => e.id !== card.dataset.id);
      saveJSON(KEYS.draft, draft);
      renderContent();
    });
    card.querySelector("[data-duplicate-ex]").addEventListener("click", () => {
      const exs = serializeExercisesFromDOM();
      const index = exs.findIndex((e) => e.id === card.dataset.id);
      if (index === -1) return;
      const original = exs[index];
      const clone = {
        ...original,
        id: uid(),
        sets: original.sets.map((s) => ({ ...s, id: uid() })),
      };
      exs.splice(index + 1, 0, clone);
      draft.exercises = exs;
      saveJSON(KEYS.draft, draft);
      renderContent();
    });
    card.querySelectorAll("[data-remove-set]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const exs = serializeExercisesFromDOM();
        const target = exs.find((e) => e.id === card.dataset.id);
        if (target.sets.length <= 1) return;
        target.sets = target.sets.filter((s) => s.id !== btn.dataset.removeSet);
        draft.exercises = exs;
        saveJSON(KEYS.draft, draft);
        renderContent();
      });
    });
    card.querySelector("[data-add-set]").addEventListener("click", () => {
      const exs = serializeExercisesFromDOM();
      const target = exs.find((e) => e.id === card.dataset.id);
      const lastSet = target.sets[target.sets.length - 1];
      target.sets.push({ id: uid(), weight: lastSet ? lastSet.weight : "", reps: lastSet ? lastSet.reps : "" });
      draft.exercises = exs;
      saveJSON(KEYS.draft, draft);
      renderContent();
    });

    card.querySelector("[data-drag-handle]").addEventListener("pointerdown", (e) => startDragExercise(e, card));
  });

  document.getElementById("add-exercise-btn").addEventListener("click", () => {
    const exs = serializeExercisesFromDOM();
    exs.push(emptyExercise());
    draft.exercises = exs;
    saveJSON(KEYS.draft, draft);
    renderContent();
  });

  document.getElementById("save-session-btn").addEventListener("click", () => {
    const exs = serializeExercisesFromDOM();
    const withData = exs
      .map((e) => ({ ...e, name: e.name.trim(), sets: e.sets.filter((s) => s.weight !== "" || s.reps !== "") }))
      .filter((e) => e.sets.length > 0);
    const cleaned = withData.map((e, idx) => ({ ...e, name: e.name || `Exercice ${idx + 1}` }));

    const errorSlot = document.getElementById("error-slot");
    if (cleaned.length === 0) {
      errorSlot.innerHTML = `<div class="error-msg">Ajoute au moins un exercice avec une série avant d'enregistrer.</div>`;
      return;
    }
    errorSlot.innerHTML = "";

    const wasEditing = !!editingSessionId;
    const existingSession = wasEditing ? sessions.find((s) => s.id === editingSessionId) : null;
    const planned = existingSession ? isUpcoming(existingSession) : dateEl.value > todayISO();
    const otherCount = sessions.filter((s) => s.id !== editingSessionId).length;
    const sessionLabel = labelEl.value.trim() || `Séance ${otherCount + 1}`;
    const session = { id: editingSessionId || uid(), date: dateEl.value, label: sessionLabel, exercises: cleaned, planned };
    if (wasEditing) {
      sessions = sessions.map((s) => (s.id === editingSessionId ? session : s));
    } else {
      sessions = [session, ...sessions];
    }
    library = Array.from(new Set([...library, ...cleaned.map((e) => e.name)])).sort((a, b) => a.localeCompare(b));
    saveJSON(KEYS.sessions, sessions);
    saveJSON(KEYS.library, library);

function startDragItem(e, item, container, onDrop) {
  e.preventDefault();
  const pointerId = e.pointerId;
  item.setPointerCapture(pointerId);
  item.classList.add("dragging");
  let startY = e.clientY;

  function onMove(ev) {
    const deltaY = ev.clientY - startY;
    item.style.transform = `translateY(${deltaY}px)`;

    const children = Array.from(container.children);
    const dragIndexCurrent = children.indexOf(item);
    const dragRect = item.getBoundingClientRect();
    const dragCenter = dragRect.top + dragRect.height / 2;

    for (const sib of children) {
      if (sib === item) continue;
      const sibRect = sib.getBoundingClientRect();
      const sibCenter = sibRect.top + sibRect.height / 2;
      const sibIndex = children.indexOf(sib);
      if (dragCenter > sibCenter && dragIndexCurrent < sibIndex) {
        container.insertBefore(item, sib.nextSibling);
        startY = ev.clientY;
        item.style.transform = "translateY(0px)";
        break;
      } else if (dragCenter < sibCenter && dragIndexCurrent > sibIndex) {
        container.insertBefore(item, sib);
        startY = ev.clientY;
        item.style.transform = "translateY(0px)";
        break;
      }
    }
  }

  function onUp() {
    try { item.releasePointerCapture(pointerId); } catch (e) {}
    item.classList.remove("dragging");
    item.style.transform = "";
    item.removeEventListener("pointermove", onMove);
    item.removeEventListener("pointerup", onUp);
    item.removeEventListener("pointercancel", onUp);
    onDrop();
  }

  item.addEventListener("pointermove", onMove);
  item.addEventListener("pointerup", onUp);
  item.addEventListener("pointercancel", onUp);
}
